[project]
name = "ragbase"
version = "0.1.0"
description = "RAG pipeline with pgvector and retrieval evals"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.40",
    "asyncpg",
    "pgvector",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg2-binary",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "python-dotenv",
    "pypdf",
    "tiktoken",
    "typer",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["eval: runs against real API (slow)"]
