name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragbase
          POSTGRES_USER: ragbase
          POSTGRES_PASSWORD: ragbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/

      - name: Type check with mypy
        run: mypy src/ragbase/

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://ragbase:ragbase@localhost:5432/ragbase
          OPENAI_API_KEY: sk-test-key-for-ci
          CHUNK_SIZE: 500
          CHUNK_OVERLAP: 50
          TOP_K: 4
        run: pytest tests/ -v -m "not eval"
